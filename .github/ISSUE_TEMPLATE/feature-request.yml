name: Feature Request
description: Suggest an idea or improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or limitation.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other details, examples, or references.
    validations:
      required: false
